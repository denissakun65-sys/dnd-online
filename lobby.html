<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Online — Создание персонажа</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body class="lobby-page">
    <div class="lobby-header">
        <h1>⚔️ Создание Персонажа</h1>
        <p>Создайте героя и отправьтесь в приключение</p>
    </div>

    <div class="lobby-body">
        <!-- LEFT COLUMN -->
        <div style="display:flex;flex-direction:column;gap:1.5rem;">
            <!-- Character Info -->
            <div class="lobby-section">
                <h2>👤 Основная информация</h2>
                <div class="form-group">
                    <label>Имя персонажа</label>
                    <input type="text" id="charName" class="form-input" placeholder="Введите имя..." maxlength="20" value="">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group">
                        <label>Раса</label>
                        <select id="charRace" class="form-select">
                            <optgroup label="📋 Основные (PHB)">
                                <option value="Человек" data-bonus="STR+1,DEX+1,CON+1,INT+1,WIS+1,CHA+1">Человек</option>
                                <option value="Эльф" data-bonus="DEX+2,WIS+1">Эльф</option>
                                <option value="Дварф" data-bonus="CON+2,WIS+1">Дварф</option>
                                <option value="Халфлинг" data-bonus="DEX+2,CHA+1">Халфлинг</option>
                                <option value="Гном" data-bonus="INT+2,CON+1">Гном</option>
                                <option value="Полуэльф" data-bonus="CHA+2,DEX+1,WIS+1">Полуэльф</option>
                                <option value="Полуорк" data-bonus="STR+2,CON+1">Полуорк</option>
                                <option value="Тифлинг" data-bonus="CHA+2,INT+1">Тифлинг</option>
                                <option value="Драконорождённый" data-bonus="STR+2,CHA+1">Драконорождённый</option>
                            </optgroup>
                            <optgroup label="📖 Volo's Guide">
                                <option value="Аасимар" data-bonus="WIS+2,CHA+1">Аасимар</option>
                                <option value="Фирболг" data-bonus="WIS+2,STR+1">Фирболг</option>
                                <option value="Голиаф" data-bonus="STR+2,CON+1">Голиаф</option>
                                <option value="Генази (Огонь)" data-bonus="INT+2,CON+1">Генази (Огонь)</option>
                                <option value="Генази (Вода)" data-bonus="WIS+2,CON+1">Генази (Вода)</option>
                                <option value="Генази (Земля)" data-bonus="STR+2,CON+1">Генази (Земля)</option>
                                <option value="Генази (Воздух)" data-bonus="DEX+2,CON+1">Генази (Воздух)</option>
                                <option value="Кенку" data-bonus="DEX+2,WIS+1">Кенку</option>
                                <option value="Табакси" data-bonus="DEX+2,CHA+1">Табакси</option>
                                <option value="Тритон" data-bonus="STR+2,CHA+1">Тритон</option>
                            </optgroup>
                            <optgroup label="📖 Mordenkainen's">
                                <option value="Чанжлинг" data-bonus="CHA+2,DEX+1">Чанжлинг</option>
                                <option value="Шифтер (Зверь)" data-bonus="DEX+2,WIS+1">Шифтер (Зверь)</option>
                                <option value="Калаштар" data-bonus="WIS+2,CHA+1">Калаштар</option>
                                <option value="Гит" data-bonus="INT+2,STR+1">Гит</option>
                                <option value="Кобольд" data-bonus="DEX+2,STR+1">Кобольд</option>
                                <option value="Хобгоблин" data-bonus="CON+2,INT+1">Хобгоблин</option>
                                <option value="Багбир" data-bonus="STR+2,DEX+1">Багбир</option>
                                <option value="Юань-ти" data-bonus="CHA+2,INT+1">Юань-ти</option>
                            </optgroup>
                            <optgroup label="📖 Tasha's / Другие">
                                <option value="Локсодон" data-bonus="CON+2,WIS+1">Локсодон</option>
                                <option value="Симик-гибрид" data-bonus="CON+2,DEX+1">Симик-гибрид</option>
                                <option value="Ведалкен" data-bonus="INT+2,WIS+1">Ведалкен</option>
                                <option value="Варфорджед" data-bonus="CON+2,STR+1">Варфорджед</option>
                                <option value="Леонин" data-bonus="CON+2,STR+1">Леонин</option>
                                <option value="Сатир" data-bonus="DEX+2,CHA+1">Сатир</option>
                                <option value="Оулен" data-bonus="WIS+2,STR+1">Оулен</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Класс</label>
                        <select id="charClass" class="form-select">
                            <option value="Варвар">⚔️ Варвар</option>
                            <option value="Бард">🎵 Бард</option>
                            <option value="Жрец">✝️ Жрец</option>
                            <option value="Друид">🌿 Друид</option>
                            <option value="Воин">🛡️ Воин</option>
                            <option value="Монах">👊 Монах</option>
                            <option value="Паладин">🦁 Паладин</option>
                            <option value="Следопыт">🏹 Следопыт</option>
                            <option value="Плут">🗡️ Плут</option>
                            <option value="Чародей">✨ Чародей</option>
                            <option value="Колдун">🔮 Колдун</option>
                            <option value="Волшебник">📖 Волшебник</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Предыстория</label>
                    <select id="charBackground" class="form-select">
                        <option value="Странник">Странник</option>
                        <option value="Аристократ">Аристократ</option>
                        <option value="Преступник">Преступник</option>
                        <option value="Мудрец">Мудрец</option>
                        <option value="Солдат">Солдат</option>
                        <option value="Целитель">Целитель</option>
                        <option value="Моряк">Моряк</option>
                        <option value="Шпион">Шпион</option>
                        <option value="Наследник">Наследник</option>
                        <option value="Рабочий">Рабочий</option>
                        <option value="Отшельник">Отшельник</option>
                        <option value="Торговец">Торговец</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Цвет персонажа</label>
                    <div class="color-picker" id="colorPicker"></div>
                </div>
            </div>

            <!-- Stats -->
            <div class="lobby-section">
                <h2>📊 Характеристики</h2>
                <div class="stat-method-tabs" id="statMethodTabs">
                    <button class="stat-method-tab active" data-method="pointbuy">Покупка (27)</button>
                    <button class="stat-method-tab" data-method="4d6">4d6 min</button>
                    <button class="stat-method-tab" data-method="standard">Стандарт</button>
                </div>
                <div class="points-left" id="pointsLeft">Очков: 27</div>
                <div class="stats-grid" id="statsGrid"></div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div style="display:flex;flex-direction:column;gap:1.5rem;">
            <!-- Avatar -->
            <div class="lobby-section" style="text-align:center;">
                <h2>🎨 Аватар</h2>
                <div class="avatar-preview" id="avatarPreview">🧙</div>
                <div class="avatar-prompt" id="avatarPrompt">Нажмите «Сгенерировать» для ИИ-аватара</div>
                <button class="btn-secondary" id="generateAvatar" style="margin:0.5rem auto;padding:0.5rem 1.5rem;font-size:0.9rem;">✨ Сгенерировать</button>
            </div>

            <!-- Campaign -->
            <div class="lobby-section">
                <h2>🏰 Кампания</h2>
                <div class="campaign-grid" id="campaignGrid"></div>
            </div>

            <!-- Room & API -->
            <div class="lobby-section">
                <h2>🌐 Подключение</h2>
                <div class="form-group">
                    <label>ИИ Провайдер</label>
                    <select id="aiProvider" class="form-select">
                        <option value="groq">Groq (бесплатно, быстро)</option>
                        <option value="gemini">Google Gemini (бесплатно)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Ключ</label>
                    <input type="password" id="apiKey" class="form-input" placeholder="Вставьте ключ...">
                    <div style="font-size:0.7rem;color:var(--text-dim);margin-top:0.3rem;">
                        Groq: <a href="https://console.groq.com/keys" target="_blank" style="color:var(--accent-gold);">console.groq.com/keys</a> |
                        Gemini: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent-gold);">aistudio.google.com</a>
                    </div>
                </div>
                <div class="form-group">
                    <label>Код комнаты (для мультиплеера)</label>
                    <input type="text" id="roomCode" class="form-input" placeholder="Придумайте код или оставьте пустым" maxlength="12">
                </div>
                <div class="start-buttons">
                    <button class="btn-primary" id="startSolo">⚔️ Одиночка</button>
                    <button class="btn-secondary" id="startOnline">👥 Онлайн</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/lobby.js"></script>
</body>
</html>
