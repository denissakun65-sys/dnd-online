<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Игра — D&D Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-body">
    <!-- Tutorial Overlay -->
    <div id="tutorialOverlay" class="tutorial-overlay hidden">
        <div class="tutorial-card">
            <div id="tutorialIcon" class="tutorial-icon">🎮</div>
            <h2 id="tutorialTitle"></h2>
            <p id="tutorialText"></p>
            <div class="tutorial-footer">
                <button id="tutorialPrev" class="btn btn-sm btn-secondary">← Назад</button>
                <span id="tutorialProgress" class="tutorial-progress">1/10</span>
                <button id="tutorialNext" class="btn btn-sm btn-primary">Далее →</button>
            </div>
            <button id="tutorialSkip" class="tutorial-skip">Пропустить обучение</button>
        </div>
    </div>

    <div class="topbar">
        <div class="topbar-left">
            <a href="lobby.html" class="btn-tiny">← Лобби</a>
            <span>Комната: <strong id="roomDisplay"></strong></span>
            <button id="copyCode" class="btn-tiny" title="Копировать">📋</button>
            <span id="connectionCount" class="conn-count">1</span>
            <span id="modeLabel" class="mode-badge"></span>
        </div>
        <div class="topbar-right">
            <button id="toggleMapTools" class="btn-tiny">🗺️ Карта</button>
            <button id="toggleFog" class="btn-tiny">🌫️ Туман</button>
            <button id="generateMap" class="btn-tiny">🎲 Генерация</button>
            <button id="toggleVoice" class="btn-tiny">🎤 Голос</button>
            <a href="lobby.html" class="btn-tiny btn-danger">Выйти</a>
        </div>
    </div>

    <div class="game-layout">
        <div class="map-panel">
            <canvas id="mapCanvas"></canvas>
            <div id="mapTools" class="map-tools hidden">
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="floor" title="Пол">⬜</button>
                    <button class="tool-btn" data-tool="wall" title="Стена">🧱</button>
                    <button class="tool-btn" data-tool="water" title="Вода">🌊</button>
                    <button class="tool-btn" data-tool="lava" title="Лава">🔥</button>
                    <button class="tool-btn" data-tool="tree" title="Дерево">🌳</button>
                    <button class="tool-btn" data-tool="door" title="Дверь">🚪</button>
                    <button class="tool-btn" data-tool="chest" title="Сундук">📦</button>
                    <button class="tool-btn" data-tool="erase" title="Стереть">🧹</button>
                </div>
                <div class="tool-group">
                    <button id="clearMap" class="tool-btn" title="Очистить">🗑️</button>
                    <button id="fillFloor" class="tool-btn" title="Залить полом">⬜</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div id="voicePanel" class="voice-panel hidden">
                <div class="voice-header">
                    <h3>🎤 Голосовой чат</h3>
                    <button id="toggleMic" class="voice-btn mic-on" title="Микрофон">🎙️</button>
                </div>
                <div id="voiceUsers" class="voice-users"></div>
            </div>

            <div class="players-list">
                <h3>👥 Группа</h3>
                <div id="playersList"></div>
            </div>

            <div id="choicesPanel" class="choices-panel hidden">
                <h3>⚔️ Что вы сделаете?</h3>
                <div id="choicesList"></div>
            </div>

            <div class="chat-panel">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Действие или /roll 1d20... (/help — помощь)" maxlength="500">
                    <button id="chatSend" class="btn-send">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Map generation modal -->
    <div id="genModal" class="modal hidden">
        <div class="modal-content">
            <h3>🎲 Генерация карты</h3>
            <div class="gen-options">
                <button class="gen-btn" data-gen="dungeon">🏰 Подземелье</button>
                <button class="gen-btn" data-gen="cave">🕳️ Пещера</button>
                <button class="gen-btn" data-gen="forest">🌲 Лес</button>
                <button class="gen-btn" data-gen="tavern">🍺 Таверна</button>
                <button class="gen-btn" data-gen="castle">🏰 Замок</button>
                <button class="gen-btn" data-gen="temple">🏛️ Храм</button>
                <button class="gen-btn" data-gen="village">🏘️ Деревня</button>
                <button class="gen-btn" data-gen="island">🏝️ Остров</button>
            </div>
            <button id="closeGenModal" class="btn btn-secondary">Закрыть</button>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/mqtt-network.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
