<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Online — Игра</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body class="game-page">
    <!-- Top Bar -->
    <div class="game-topbar">
        <div class="topbar-left">
            <span class="topbar-logo">🎲 D&D Online</span>
            <span class="topbar-room" id="roomDisplay" title="Нажмите чтобы скопировать">—</span>
            <span class="topbar-mode" id="modeLabel">⚔️ Одиночка</span>
            <span class="topbar-count" id="connectionCount">1</span>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" id="toggleCharSheet" title="Персонаж (C)">👤</button>
            <button class="topbar-btn" id="toggleInventory" title="Инвентарь (I)">🎒</button>
            <button class="topbar-btn" id="toggleCombat" title="Бой (B)">⚔️</button>
            <button class="topbar-btn" id="toggleVoice" title="Голосовой чат">🎤</button>
            <button class="topbar-btn" id="toggleMic" title="Микрофон">🎙️</button>
            <button class="topbar-btn" id="toggleFog" title="Туман войны">🌫️</button>
            <button class="topbar-btn" id="generateMap" title="Генерация карты">🗺️</button>
            <button class="topbar-btn" id="toggleMapTools" title="Инструменты карты">🔧</button>
            <button class="topbar-btn" id="toggleMinimap" title="Мини-карта (M)">📌</button>
            <a href="lobby.html" class="topbar-btn" title="Выйти">🚪</a>
        </div>
    </div>

    <!-- Map Area -->
    <div class="map-area">
        <canvas id="mapCanvas"></canvas>

        <!-- Minimap -->
        <div class="minimap-container hidden" id="minimapContainer">
            <canvas id="minimapCanvas" width="160" height="160"></canvas>
            <div class="minimap-label">Мини-карта</div>
        </div>

        <!-- Quick Actions Bar -->
        <div class="quick-actions" id="quickActions">
            <button class="qa-btn" data-action="attack" title="Атаковать (A)">⚔️</button>
            <button class="qa-btn" data-action="defend" title="Защититься (D)">🛡️</button>
            <button class="qa-btn" data-action="skill" title="Проверка навыка (S)">🎯</button>
            <button class="qa-btn" data-action="cast" title="Заклинание (Z)">✨</button>
            <button class="qa-btn" data-action="heal" title="Лечение (H)">❤️</button>
            <button class="qa-btn" data-action="search" title="Обыскать (F)">🔍</button>
            <button class="qa-btn" data-action="talk" title="Говорить (T)">💬</button>
            <button class="qa-btn" data-action="stealth" title="Скрытность (G)">🥷</button>
            <button class="qa-btn" data-action="rest" title="Отдых (R)">🏕️</button>
        </div>

        <!-- Map tools floating -->
        <div class="map-tools-float hidden" id="mapTools">
            <button class="map-tool-btn active" data-tool="floor" title="Пол">⬜</button>
            <button class="map-tool-btn" data-tool="wall" title="Стена">🧱</button>
            <button class="map-tool-btn" data-tool="door" title="Дверь">🚪</button>
            <button class="map-tool-btn" data-tool="water" title="Вода">💧</button>
            <button class="map-tool-btn" data-tool="lava" title="Лава">🔥</button>
            <button class="map-tool-btn" data-tool="tree" title="Дерево">🌳</button>
            <button class="map-tool-btn" data-tool="chest" title="Сундук">📦</button>
            <button class="map-tool-btn" data-tool="trap" title="Ловушка">⚠️</button>
            <button class="map-tool-btn" data-tool="stairs" title="Лестница">🪜</button>
            <button class="map-tool-btn" data-tool="empty" title="Ластик">🧹</button>
        </div>

        <!-- Map generation modal -->
        <div class="map-gen-modal hidden" id="genModal">
            <h3>🗺️ Генерация карты</h3>
            <div class="gen-grid">
                <button class="gen-btn" data-gen="dungeon">⚔️ Подземелье</button>
                <button class="gen-btn" data-gen="cave">🕳️ Пещера</button>
                <button class="gen-btn" data-gen="forest">🌲 Лес</button>
                <button class="gen-btn" data-gen="tavern">🍺 Таверна</button>
                <button class="gen-btn" data-gen="castle">🏰 Замок</button>
                <button class="gen-btn" data-gen="temple">🏛️ Храм</button>
                <button class="gen-btn" data-gen="village">🏘️ Деревня</button>
                <button class="gen-btn" data-gen="island">🏝️ Остров</button>
            </div>
            <div style="text-align:center;margin-top:1rem;">
                <button class="btn-secondary" id="closeGenModal" style="padding:0.4rem 1rem;font-size:0.85rem;">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <!-- Players -->
        <div class="players-panel">
            <h3>👥 Игроки</h3>
            <div id="playersList"></div>
        </div>

        <!-- Chat -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="typing-indicator" id="typingIndicator">🧙 Мастер думает...</div>
        </div>

        <!-- Choices -->
        <div class="choices-panel" id="choicesPanel">
            <h4>⚔️ Выберите действие</h4>
            <div id="choicesList"></div>
        </div>

        <!-- Voice -->
        <div class="voice-panel" id="voicePanel">
            <h4 style="font-family:var(--font-heading);font-size:0.7rem;color:var(--text-ghost);letter-spacing:0.15em;margin-bottom:0.3rem;text-transform:uppercase;">🎤 Голос</h4>
            <div class="voice-users" id="voiceUsers"></div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Действие или /roll 1d20... (Enter)">
            <button id="chatSend">⚔️</button>
        </div>
    </div>

    <!-- Character Sheet Panel (overlay) -->
    <div class="char-sheet hidden" id="charSheet">
        <div class="char-sheet-header">
            <h3>👤 Лист персонажа</h3>
            <button class="char-sheet-close" id="closeCharSheet">✕</button>
        </div>
        <div class="char-sheet-body" id="charSheetBody">
            <!-- Filled by JS -->
        </div>
    </div>

    <!-- Inventory Panel (overlay) -->
    <div class="inventory-panel hidden" id="inventoryPanel">
        <div class="inv-header">
            <h3>🎒 Инвентарь</h3>
            <button class="char-sheet-close" id="closeInventory">✕</button>
        </div>
        <div class="inv-body" id="invBody">
            <div class="inv-slots" id="invSlots">
                <!-- Filled by JS -->
            </div>
            <div class="inv-gold">
                <span>💰 Золото:</span>
                <span id="invGold">0</span>
            </div>
        </div>
    </div>

    <!-- Combat Tracker (overlay) -->
    <div class="combat-panel hidden" id="combatPanel">
        <div class="combat-header">
            <h3>⚔️ Трекер боя</h3>
            <button class="char-sheet-close" id="closeCombat">✕</button>
        </div>
        <div class="combat-body" id="combatBody">
            <div class="combat-round">Раунд: <span id="combatRound">1</span></div>
            <div class="combat-turn-order" id="combatTurnOrder">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Tutorial Overlay -->
    <div class="tutorial-overlay hidden" id="tutorialOverlay">
        <div class="tutorial-card">
            <div class="tutorial-icon" id="tutorialIcon">🎮</div>
            <div class="tutorial-title" id="tutorialTitle">Добро пожаловать!</div>
            <div class="tutorial-text" id="tutorialText">Текст</div>
            <div class="tutorial-progress" id="tutorialProgress">1/8</div>
            <div class="tutorial-nav">
                <button class="tutorial-skip" id="tutorialPrev" style="visibility:hidden;">← Назад</button>
                <button class="tutorial-skip" id="tutorialSkip">Пропустить</button>
                <button class="tutorial-next" id="tutorialNext">Далее →</button>
            </div>
        </div>
    </div>

    <!-- Scripts (with cache-busting) -->
    <script src="https://unpkg.com/mqtt@5.5.0/dist/mqtt.min.js"></script>
    <script src="js/network.js?v=8"></script>
    <script src="js/map.js?v=8"></script>
    <script src="js/ai.js?v=8"></script>
    <script src="js/game.js?v=8"></script>
</body>
</html>
