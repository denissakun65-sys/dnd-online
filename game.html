<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Online — Игра</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body class="game-page">
    <!-- Top Bar -->
    <div class="game-topbar">
        <div class="topbar-left">
            <span class="topbar-logo">🎲 D&D Online</span>
            <span class="topbar-room" id="roomDisplay" title="Нажмите чтобы скопировать">—</span>
            <span class="topbar-mode" id="modeLabel">⚔️ Одиночка</span>
            <span class="topbar-count" id="connectionCount">1</span>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" id="toggleVoice" title="Голосовой чат">🎤</button>
            <button class="topbar-btn" id="toggleMic" title="Микрофон">🎙️</button>
            <button class="topbar-btn" id="toggleFog" title="Туман войны">🌫️</button>
            <button class="topbar-btn" id="generateMap" title="Генерация карты">🗺️</button>
            <button class="topbar-btn" id="toggleMapTools" title="Инструменты карты">🔧</button>
            <a href="lobby.html" class="topbar-btn" title="Выйти">🚪</a>
        </div>
    </div>

    <!-- Map Area -->
    <div class="map-area">
        <canvas id="mapCanvas"></canvas>

        <!-- Map tools floating -->
        <div class="map-tools-float hidden" id="mapTools">
            <button class="map-tool-btn active" data-tool="floor" title="Пол">⬜</button>
            <button class="map-tool-btn" data-tool="wall" title="Стена">🧱</button>
            <button class="map-tool-btn" data-tool="door" title="Дверь">🚪</button>
            <button class="map-tool-btn" data-tool="water" title="Вода">💧</button>
            <button class="map-tool-btn" data-tool="lava" title="Лава">🔥</button>
            <button class="map-tool-btn" data-tool="tree" title="Дерево">🌳</button>
            <button class="map-tool-btn" data-tool="chest" title="Сундук">📦</button>
            <button class="map-tool-btn" data-tool="trap" title="Ловушка">⚠️</button>
            <button class="map-tool-btn" data-tool="stairs" title="Лестница">🪜</button>
            <button class="map-tool-btn" data-tool="empty" title="Ластик">🧹</button>
        </div>

        <!-- Map generation modal -->
        <div class="map-gen-modal hidden" id="genModal">
            <h3>🗺️ Генерация карты</h3>
            <div class="gen-grid">
                <button class="gen-btn" data-gen="dungeon">⚔️ Подземелье</button>
                <button class="gen-btn" data-gen="cave">🕳️ Пещера</button>
                <button class="gen-btn" data-gen="forest">🌲 Лес</button>
                <button class="gen-btn" data-gen="tavern">🍺 Таверна</button>
                <button class="gen-btn" data-gen="castle">🏰 Замок</button>
                <button class="gen-btn" data-gen="temple">🏛️ Храм</button>
                <button class="gen-btn" data-gen="village">🏘️ Деревня</button>
                <button class="gen-btn" data-gen="island">🏝️ Остров</button>
            </div>
            <div style="text-align:center;margin-top:1rem;">
                <button class="btn-secondary" id="closeGenModal" style="padding:0.4rem 1rem;font-size:0.85rem;">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <!-- Players -->
        <div class="players-panel">
            <h3>👥 ИГРОКИ</h3>
            <div id="playersList"></div>
        </div>

        <!-- Chat -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="typing-indicator" id="typingIndicator">🧙 Мастер думает...</div>
        </div>

        <!-- Choices -->
        <div class="choices-panel" id="choicesPanel">
            <h4>⚔️ ВЫБЕРИТЕ ДЕЙСТВИЕ</h4>
            <div id="choicesList"></div>
        </div>

        <!-- Voice -->
        <div class="voice-panel" id="voicePanel">
            <h4 style="font-family:var(--font-heading);font-size:0.75rem;color:var(--text-dim);letter-spacing:0.1em;margin-bottom:0.3rem;">🎤 ГОЛОС</h4>
            <div class="voice-users" id="voiceUsers"></div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Действие или /roll 1d20...">
            <button id="chatSend">⚔️</button>
        </div>
    </div>

    <!-- Tutorial Overlay -->
    <div class="tutorial-overlay hidden" id="tutorialOverlay">
        <div class="tutorial-card">
            <div class="tutorial-icon" id="tutorialIcon">🎮</div>
            <div class="tutorial-title" id="tutorialTitle">Добро пожаловать!</div>
            <div class="tutorial-text" id="tutorialText">Текст</div>
            <div class="tutorial-progress" id="tutorialProgress">1/6</div>
            <div class="tutorial-nav">
                <button class="tutorial-skip" id="tutorialPrev" style="visibility:hidden;">← Назад</button>
                <button class="tutorial-skip" id="tutorialSkip">Пропустить</button>
                <button class="tutorial-next" id="tutorialNext">Далее →</button>
            </div>
        </div>
    </div>

    <!-- Scripts (with cache-busting) -->
    <script src="https://unpkg.com/mqtt@5.5.0/dist/mqtt.min.js"></script>
    <script src="js/network.js?v=6"></script>
    <script src="js/map.js?v=6"></script>
    <script src="js/ai.js?v=6"></script>
    <script src="js/game.js?v=6"></script>
</body>
</html>
